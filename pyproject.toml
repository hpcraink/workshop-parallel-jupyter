[project]
name = "workshop-parallel-jupyter"
version = "0.1.0"
description = "Workshop: data science and parallel computing with Python in Jupyter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=6.29",
    "jupyterlab>=4.3",
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "scikit-learn>=1.5",
    "pyarrow>=17.0",
    "hvplot>=0.11",
    "bokeh>=3.5",
    "plotly>=5.24",
    "kaleido>=0.2",
    "palmerpenguins>=0.1.4",
    "nltk>=3.9",
    "tensorflow>=2.18",
    "tensorboard>=2.18",
    "torch==2.10.0",
    "dask[complete]>=2024.8",
    "distributed>=2024.8",
    "dask-jobqueue>=0.9",
    "dask-ml>=2024.4",
    "dask-mpi>=2022.4",
    "mpi4py>=3.1",
]

[dependency-groups]
dev = ["nbconvert>=7.16.6", "nbformat>=5.10", "pytest>=8.3.5", "pytest-html>=4.1.1"]
