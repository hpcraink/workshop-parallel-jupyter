<text x='450.0' y='300' font-family='Helvetica,Arial,sans-serif' font-size='14' text-anchor='middle' fill='#1f2937' font-weight='normal' font-style='normal'>The model looks at 32 rows, computes the error, and updates its weights once.</text>
<text x='450.0' y='324' font-family='Helvetica,Arial,sans-serif' font-size='14' text-anchor='middle' fill='#1f2937' font-weight='normal' font-style='normal'>Then it moves on to the next 32 rows.</text>
<rect x='150' y='352' width='600' height='84' rx='8' fill='#f8fafc' stroke='#cbd5e1'/>
<text x='450.0' y='378' font-family='Helvetica,Arial,sans-serif' font-size='14' text-anchor='middle' fill='#1f2937' font-weight='bold' font-style='normal'>400 training rows  ÷  batch_size 32  =  13 weight updates per epoch</text>
<text x='450.0' y='404' font-family='Helvetica,Arial,sans-serif' font-size='14' text-anchor='middle' fill='#1f2937' font-weight='bold' font-style='normal'>100 epochs  ×  13  =  1300 updates in total</text>
<text x='450.0' y='426' font-family='Helvetica,Arial,sans-serif' font-size='12' text-anchor='middle' fill='#6b7280' font-weight='normal' font-style='italic'>smaller batches → more updates, slower;  larger → fewer, faster but coarser</text>
</svg>
